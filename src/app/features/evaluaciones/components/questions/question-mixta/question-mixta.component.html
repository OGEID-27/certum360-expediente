<div class="rounded-lg border border-gray-200 p-4 dark:border-gray-700">
  <p class="mb-2 text-sm font-medium text-gray-800 dark:text-white/90">
    {{ question.titulo }}
    @if (question.obligatoria) {
    <span class="text-error-500">*</span>
    }
  </p>

  @if (question.ayuda) {
  <p class="mb-3 text-xs text-gray-500 dark:text-gray-400">{{ question.ayuda }}</p>
  }

  <div class="space-y-2">
    @for (option of options; track option.id) {
    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
      <input
        class="h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
        [type]="isMultiple ? 'checkbox' : 'radio'"
        [name]="question.id"
        [checked]="isChecked(option.id)"
        (change)="toggleOption(option.id, $any($event.target).checked)"
      />
      <span>{{ option.texto }}</span>
    </label>
    }

    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
      <input
        class="h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
        [type]="isMultiple ? 'checkbox' : 'radio'"
        [name]="question.id"
        [checked]="isChecked(otherOptionValue)"
        (change)="toggleOther($any($event.target).checked)"
      />
      <span>{{ otherLabel }}</span>
    </label>

    @if (showOtherTextInput) {
    <input
      type="text"
      [value]="control.value?.otherText ?? ''"
      [placeholder]="otherPlaceholder"
      (input)="updateOtherText($any($event.target).value)"
      class="h-10 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
    />
    }
  </div>

  @if (showRequiredError) {
  <p class="mt-2 text-xs text-error-500">Debes responder esta pregunta.</p>
  }
</div>
