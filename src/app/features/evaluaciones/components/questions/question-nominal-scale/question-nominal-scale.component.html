<div class="rounded-lg border border-gray-200 p-4 dark:border-gray-700">
  <p class="mb-2 text-sm font-medium text-gray-800 dark:text-white/90">
    {{ question.titulo }}
    @if (question.obligatoria) {
      <span class="text-error-500">*</span>
    }
  </p>

  @if (question.ayuda) {
    <p class="mb-3 text-xs text-gray-500 dark:text-gray-400">
      {{ question.ayuda }}
    </p>
  }

  <div
    class="gap-2"
    [ngClass]="{
      'flex flex-wrap': orientation === 'horizontal',
      'grid grid-cols-1': orientation === 'vertical',
    }"
  >
    @for (label of labels; track label) {
      <button
        type="button"
        class="rounded-lg border px-3 py-2 text-sm transition"
        [ngClass]="{
          'border-brand-300 bg-brand-50 text-brand-700 dark:border-brand-500/40 dark:bg-brand-500/10 dark:text-brand-300':
            isSelected(label),
          'bg-white border-gray-300 text-gray-700 hover:border-brand-200 hover:bg-brand-50/60 dark:border-gray-700 dark:hover:border-brand-500/40 dark:hover:bg-brand-500/10 dark:bg-gray-900 dark:text-white/90':
            !isSelected(label),
        }"
        (click)="selectLabel(label)"
      >
        {{ label }}
      </button>
    }
  </div>

  @if (showRequiredError) {
    <p class="mt-2 text-xs text-error-500">Debes seleccionar una opcion.</p>
  }
</div>
