<div class="rounded-lg border border-gray-200 p-4 dark:border-gray-700">
  <p class="mb-2 text-sm font-medium text-gray-800 dark:text-white/90">
    {{ question.titulo }}
    @if (question.obligatoria) {
      <span class="text-error-500">*</span>
    }
  </p>

  @if (question.ayuda) {
    <p class="mb-3 text-xs text-gray-500 dark:text-gray-400">{{ question.ayuda }}</p>
  }

  <div class="space-y-2">
    @for (option of options; track option.id) {
      <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
        <input
          class="h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500"
          [type]="isMultiple ? 'checkbox' : 'radio'"
          [name]="question.id"
          [checked]="isChecked(option.id)"
          (change)="toggleOption(option.id, $any($event.target).checked)"
        />
        <span>{{ option.texto }}</span>
      </label>
    }
  </div>

  @if (showRequiredError) {
    <p class="mt-2 text-xs text-error-500">Debes responder esta pregunta.</p>
  }
</div>
