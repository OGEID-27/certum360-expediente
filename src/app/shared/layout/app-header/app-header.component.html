<header
  class="app-header-floating fixed top-3 right-2 left-2 z-99999 transition-all duration-300 sm:top-4 sm:right-4 sm:left-4 xl:top-5 xl:right-6"
  [ngClass]="{
    'xl:left-[306px]': (isExpanded$ | async) || (isHovered$ | async),
    'xl:left-[106px]': !((isExpanded$ | async) || (isHovered$ | async)),
  }"
>
  <div
    class="app-header-glass flex w-full min-w-0 flex-col justify-between gap-2 overflow-visible sm:gap-3 xl:min-w-[760px] xl:flex-row xl:items-center xl:gap-4"
  >
    <div
      class="app-header-primary-row flex w-full min-w-0 flex-wrap items-center justify-between gap-2 border-b border-gray-200 dark:border-gray-800 sm:gap-4 xl:flex-1 xl:flex-nowrap xl:justify-normal xl:gap-3 xl:border-b-0"
    >
      <button
        class="z-99999 flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border-gray-200 text-gray-500 dark:border-gray-800 dark:text-gray-400 lg:h-11 lg:w-11 xl:border"
        [ngClass]="{
          'bg-gray-100 dark:bg-white/[0.03]': isMobileOpen$ | async,
        }"
        (click)="handleToggle()"
        aria-label="Toggle Sidebar"
      >
        @if (isMobileOpen$ | async) {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M6.21967 7.28131C5.92678 6.98841 5.92678 6.51354 6.21967 6.22065C6.51256 5.92775 6.98744 5.92775 7.28033 6.22065L11.999 10.9393L16.7176 6.22078C17.0105 5.92789 17.4854 5.92788 17.7782 6.22078C18.0711 6.51367 18.0711 6.98855 17.7782 7.28144L13.0597 12L17.7782 16.7186C18.0711 17.0115 18.0711 17.4863 17.7782 17.7792C17.4854 18.0721 17.0105 18.0721 16.7176 17.7792L11.999 13.0607L7.28033 17.7794C6.98744 18.0722 6.51256 18.0722 6.21967 17.7794C5.92678 17.4865 5.92678 17.0116 6.21967 16.7187L10.9384 12L6.21967 7.28131Z"
              fill="currentColor"
            />
          </svg>
        } @else {
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M0.583252 1C0.583252 0.585788 0.919038 0.25 1.33325 0.25H14.6666C15.0808 0.25 15.4166 0.585786 15.4166 1C15.4166 1.41421 15.0808 1.75 14.6666 1.75L1.33325 1.75C0.919038 1.75 0.583252 1.41422 0.583252 1ZM0.583252 11C0.583252 10.5858 0.919038 10.25 1.33325 10.25L14.6666 10.25C15.0808 10.25 15.4166 10.5858 15.4166 11C15.4166 11.4142 15.0808 11.75 14.6666 11.75L1.33325 11.75C0.919038 11.75 0.583252 11.4142 0.583252 11ZM1.33325 5.25C0.919038 5.25 0.583252 5.58579 0.583252 6C0.583252 6.41421 0.919038 6.75 1.33325 6.75L7.99992 6.75C8.41413 6.75 8.74992 6.41421 8.74992 6C8.74992 5.58579 8.41413 5.25 7.99992 5.25L1.33325 5.25Z"
              fill="currentColor"
            />
          </svg>
        }
      </button>

      <a [routerLink]="homePath" class="shrink-0 xl:hidden">
        <img class="dark:hidden" src="/images/logo/logo.svg" alt="Logo" />
        <img
          class="hidden dark:block"
          src="/images/logo/logo-dark.svg"
          alt="Logo"
        />
      </a>

      <button
        (click)="toggleApplicationMenu()"
        class="z-99999 flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 xl:hidden"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M5.99902 10.4951C6.82745 10.4951 7.49902 11.1667 7.49902 11.9951V12.0051C7.49902 12.8335 6.82745 13.5051 5.99902 13.5051C5.1706 13.5051 4.49902 12.8335 4.49902 12.0051V11.9951C4.49902 11.1667 5.1706 10.4951 5.99902 10.4951ZM17.999 10.4951C18.8275 10.4951 19.499 11.1667 19.499 11.9951V12.0051C19.499 12.8335 18.8275 13.5051 17.999 13.5051C17.1706 13.5051 16.499 12.8335 16.499 12.0051V11.9951C16.499 11.1667 17.1706 10.4951 17.999 10.4951ZM13.499 11.9951C13.499 11.1667 12.8275 10.4951 11.999 10.4951C11.1706 10.4951 10.499 11.1667 10.499 11.9951V12.0051C10.499 12.8335 11.1706 13.5051 11.999 13.5051C12.8275 13.5051 13.499 12.8335 13.499 12.0051V11.9951Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <div
        class="hidden min-w-0 xl:block xl:flex-1 xl:min-w-[300px] xl:max-w-[470px]"
      >
        <form class="w-full">
          <div class="relative">
            <span
              class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2"
            >
              <svg
                class="fill-gray-500 dark:fill-gray-400"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M3.04175 9.37363C3.04175 5.87693 5.87711 3.04199 9.37508 3.04199C12.8731 3.04199 15.7084 5.87693 15.7084 9.37363C15.7084 12.8703 12.8731 15.7053 9.37508 15.7053C5.87711 15.7053 3.04175 12.8703 3.04175 9.37363ZM9.37508 1.54199C5.04902 1.54199 1.54175 5.04817 1.54175 9.37363C1.54175 13.6991 5.04902 17.2053 9.37508 17.2053C11.2674 17.2053 13.003 16.5344 14.357 15.4176L17.177 18.238C17.4699 18.5309 17.9448 18.5309 18.2377 18.238C18.5306 17.9451 18.5306 17.4703 18.2377 17.1774L15.418 14.3573C16.5365 13.0033 17.2084 11.2669 17.2084 9.37363C17.2084 5.04817 13.7011 1.54199 9.37508 1.54199Z"
                />
              </svg>
            </span>
            <input
              #searchInput
              type="text"
              placeholder="Search or type command..."
              class="dark:bg-dark-900 h-11 w-full min-w-0 rounded-lg border border-gray-200 bg-transparent py-2.5 pr-14 pl-12 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:bg-gray-900 dark:bg-white/[0.03] dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
            <button
              class="absolute top-1/2 right-2.5 inline-flex -translate-y-1/2 items-center gap-0.5 rounded-lg border border-gray-200 bg-gray-50 px-[7px] py-[4.5px] text-xs -tracking-[0.2px] text-gray-500 dark:border-gray-800 dark:bg-white/[0.03] dark:text-gray-400"
            >
              <span>Cmd</span>
              <span>K</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
      class="app-header-secondary-row min-w-0 w-full flex-wrap items-center justify-between gap-3 shadow-theme-md xl:flex xl:w-auto xl:flex-nowrap xl:justify-end xl:shadow-none"
    >
      <div class="flex min-w-0 flex-wrap items-center gap-2 2xsm:gap-3">
        <app-theme-toggle-button />
        @if (showNotifications) {
          <app-notification-dropdown [role]="currentRole" />
        }
      </div>

      <div class="relative z-[100002] shrink-0">
        <button
          type="button"
          class="dropdown-toggle flex items-center gap-3 rounded-2xl border border-gray-200/80 bg-transparent px-2.5 py-2 text-left text-gray-700 shadow-theme-xs backdrop-blur-sm transition hover:border-brand-300/60 hover:bg-white/90 dark:border-white/10 dark:text-gray-200 dark:hover:border-brand-500/30"
          (click)="toggleUserMenu()"
        >
          <span
            class="app-header-avatar-liquid inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/30 text-sm font-semibold tracking-[0.14em] text-white dark:border-white/10"
          >
            {{ currentUserInitials }}
          </span>

          <span class="hidden min-w-0 sm:block">
            <span
              class="block text-sm font-semibold text-gray-900 dark:text-white/90"
            >
              {{ currentUserName }}
            </span>
            <span class="block text-xs text-gray-500 dark:text-gray-400">
              {{ currentRoleLabel }}
            </span>
          </span>

          <svg
            class="h-4 w-4 stroke-current text-gray-500 transition-transform duration-200 dark:text-gray-400"
            [ngClass]="{ 'rotate-180': isUserMenuOpen }"
            viewBox="0 0 18 20"
            fill="none"
          >
            <path
              d="M4.3125 8.65625L9 13.3437L13.6875 8.65625"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <app-dropdown
          [isOpen]="isUserMenuOpen"
          (close)="closeUserMenu()"
          className="app-bg-card-glass z-[100003] mt-3 mr-0 w-[min(21rem,calc(100vw-1rem))] overflow-hidden rounded-[24px] border-0 p-2 shadow-[0_30px_70px_-32px_rgba(15,23,42,0.6)]"
        >
          <div class="flex items-center gap-3 rounded-[20px] px-3 py-3">
            <span
              class="app-header-avatar-liquid inline-flex h-12 w-12 items-center justify-center rounded-full border border-white/30 text-sm font-semibold tracking-[0.14em] text-white dark:border-white/10"
            >
              {{ currentUserInitials }}
            </span>

            <div class="min-w-0">
              <span
                class="block truncate text-sm font-semibold text-gray-900 dark:text-white/90"
              >
                {{ currentUserName }}
              </span>
              <span
                class="mt-0.5 block text-xs text-gray-500 dark:text-gray-400"
              >
                {{ currentRoleLabel }} / {{ currentUserEmail }}
              </span>
            </div>
          </div>

          <ul
            class="flex flex-col gap-1 border-t border-gray-200/80 px-1 pt-3 pb-1 dark:border-white/10"
          >
            @if (showSettings) {
              <li>
                <button
                  type="button"
                  class="group flex w-full items-center gap-3 rounded-2xl px-3 py-3 text-left text-sm font-medium text-gray-700 transition hover:bg-white/80 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-white/6 dark:hover:text-white"
                  (click)="navigateToSettings()"
                >
                  <span
                    class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-brand-500/10 text-brand-600 transition group-hover:bg-brand-500/15 dark:text-brand-300"
                  >
                    <lucide-icon [img]="Settings" class="h-5 w-5"></lucide-icon>
                  </span>

                  <span class="min-w-0">
                    <span class="block font-semibold">Configuracion</span>
                    <span
                      class="mt-0.5 block text-xs text-gray-500 dark:text-gray-400"
                    >
                      Perfil, cuenta y metodos de pago
                    </span>
                  </span>
                </button>
              </li>
            }
          </ul>

          <button
            type="button"
            class="group mt-1 flex w-full items-center gap-3 rounded-2xl px-4 py-3 text-left text-sm font-medium text-red-600 transition hover:bg-red-50 dark:text-red-300 dark:hover:bg-red-500/10"
            (click)="logout()"
          >
            <span
              class="inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-red-500/10 text-red-600 transition group-hover:bg-red-500/15 dark:text-red-300"
            >
              <lucide-icon [img]="LogOut" class="h-5 w-5"></lucide-icon>
            </span>

            <span class="min-w-0">
              <span class="block font-semibold">Cerrar sesion</span>
              <span
                class="mt-0.5 block text-xs text-red-500/80 dark:text-red-300/70"
              >
                {{
                  currentRole === "user"
                    ? "Volver a /login-user"
                    : "Volver a /login-admin"
                }}
              </span>
            </span>
          </button>
        </app-dropdown>
      </div>
    </div>
  </div>
</header>
