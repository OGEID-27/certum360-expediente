@if (state$ | async; as state) {
  @if (state.isOpen && state.options) {
    <div
      class="app-modal-glass fixed inset-0 z-[99999] flex items-center justify-center p-4 sm:p-6"
    >
      <button
        type="button"
        class="absolute inset-0"
        aria-label="Cerrar confirmacion"
        (click)="onCancel()"
      ></button>

      <div
        class="app-bg-modal-glass relative w-full max-w-xl overflow-hidden rounded-2xl border"
        [ngClass]="getModalBorderClass(state.options.type)"
      >
        <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800">
          <div class="flex items-center gap-3">
            <span
              class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
              [ngClass]="getTypeIconContainerClass(state.options.type)"
            >
              <lucide-icon
                [img]="getTypeIcon(state.options.type)"
                [ngClass]="getTypeIconClass(state.options.type)"
                class="h-8 w-5"
              ></lucide-icon>
            </span>

            <h1 class="text-lg font-semibold text-gray-900 dark:text-white/90">
              {{ state.options.title }}
            </h1>
          </div>
        </div>

        <div class="px-5 py-5">
          <p class="text-base leading-relaxed text-gray-600 dark:text-gray-300">
            {{ state.options.message }}
          </p>
        </div>

        <div
          class="flex items-center justify-end gap-3 border-t border-gray-200 dark:border-gray-800 px-5 py-4"
        >
          <button
            type="button"
            class="inline-flex h-10 items-center justify-center rounded-lg border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 transition hover:bg-gray-100 focus:outline-hidden focus:ring-2 focus:ring-gray-300/50 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:hover:bg-gray-800"
            (click)="onCancel()"
          >
            {{ state.options.cancelText }}
          </button>

          <button
            type="button"
            class="inline-flex h-10 items-center justify-center rounded-lg px-4 text-sm font-medium text-white transition focus:outline-hidden focus:ring-2"
            [ngClass]="getConfirmButtonClass(state.options.type)"
            (click)="onConfirm()"
          >
            {{ state.options.confirmText }}
          </button>
        </div>
      </div>
    </div>
  }
}
